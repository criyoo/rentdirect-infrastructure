name: Deploy Development

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      destroy:
        description: Destroy infrastructure
        required: true
        type: boolean
        default: false # Do not change

# To control which jobs to run, set the DESTROY_DEV environment variable to "true" or "false"
env:
  DESTROY_DEV: "false" # "false" = skip destroy job & "true" = run destroy job.
  AWS_USE_PROFILE: "0"
  AWS_REGION: "eu-west-1"
  TERRAFORM_VERSION: "1.15.0"
  ENCRYPTED_ENV_FILE: "envs/secrets/.env.${{ vars.WORKSPACE }}.age"
  DECRYPTED_ENV_FILE: "envs/secrets/.env.${{ vars.WORKSPACE }}"
  AGE_KEY_FILE: "envs/secrets/.env.${{ vars.WORKSPACE }}.key"

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: deploy-development
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: terraform


jobs:
  determine-action:
    name: Determine Terraform Action
    runs-on: ${{ vars.RUNNER_SERVER }}
    environment: development
    outputs:
      destroy: ${{ steps.action.outputs.destroy }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine requested action
        id: action
        run: echo "destroy=${{ vars.DESTROY == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.destroy) || (github.event_name == 'push' && env.DESTROY_DEV == 'true')) }}" >> "$GITHUB_OUTPUT"


  detect-changes:
    needs: determine-action
    if: ${{ needs.determine-action.outputs.destroy != 'true' }}
    runs-on: ${{ vars.RUNNER_SERVER }}
    timeout-minutes: 1
    environment: development
    outputs:
      changes: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for file Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - "Makefile"
              - "scripts/**"
              - "terraform/**"
              - ".github/workflows/${{ vars.WORKSPACE }}.yml"

  setup:
    needs:
      - determine-action
      - detect-changes
    if: ${{ needs.determine-action.outputs.destroy != 'true' && needs.detect-changes.outputs.changes == 'true' }}
    runs-on: ${{ vars.RUNNER_SERVER }}
    timeout-minutes: 2
    environment: development
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install -y age

      - name: Create age key file
        run: |
          printf '%s\n' "${{ secrets.AGE_SECRET_KEY }}" > "${{ env.AGE_KEY_FILE }}"
          chmod 600 "${{ env.AGE_KEY_FILE }}"

      - name: Decrypt secrets key
        run: |
          age --decrypt --identity "${{ env.AGE_KEY_FILE }}" --output "${{ env.DECRYPTED_ENV_FILE }}" "${{ env.ENCRYPTED_ENV_FILE }}"
          chmod 600 "${{ env.DECRYPTED_ENV_FILE }}"

      - name: Verify decrypted file exists
        run: |
          pwd
          ls -la envs/secrets
          test -f "${{ env.DECRYPTED_ENV_FILE }}"

      - name: Upload decrypted file
        uses: actions/upload-artifact@v4
        with:
          name: decrypted-secrets
          path: terraform/${{ env.DECRYPTED_ENV_FILE }}
          retention-days: 1
          include-hidden-files: true

  lint:
    needs:
      - determine-action
      - detect-changes
      - setup
    if: ${{ needs.determine-action.outputs.destroy != 'true' && needs.detect-changes.outputs.changes == 'true' }}
    runs-on: ${{ vars.RUNNER_SERVER }}
    timeout-minutes: 3
    environment: development
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download decrypted secrets
        uses: actions/download-artifact@v4
        with:
          name: decrypted-secrets
          path: terraform/envs/secrets

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROOT_ACCOUNT_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "${{ env.TERRAFORM_VERSION }}"

      - name: Terraform validate
        run: | 
          make fmt
          make lint WORKSPACE=${{ vars.WORKSPACE }}

  plan:
    needs:
      - determine-action
      - detect-changes
      - lint
    if: ${{ needs.determine-action.outputs.destroy != 'true' && needs.detect-changes.outputs.changes == 'true' }}
    runs-on: ${{ vars.RUNNER_SERVER }}
    timeout-minutes: 10
    environment: development
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download decrypted secrets
        uses: actions/download-artifact@v4
        with:
          name: decrypted-secrets
          path: terraform/envs/secrets

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "${{ env.TERRAFORM_VERSION }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROOT_ACCOUNT_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform plan
        run: make plan WORKSPACE=${{ vars.WORKSPACE }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  apply:
    needs:
      - determine-action
      - detect-changes
      - plan
    if: ${{ needs.determine-action.outputs.destroy != 'true' && needs.detect-changes.outputs.changes == 'true' }}
    runs-on: ${{ vars.RUNNER_SERVER }}
    timeout-minutes: 30
    environment: development
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download decrypted secrets
        uses: actions/download-artifact@v4
        with:
          name: decrypted-secrets
          path: terraform/envs/secrets

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "${{ env.TERRAFORM_VERSION }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROOT_ACCOUNT_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform apply
        run: make apply WORKSPACE=${{ vars.WORKSPACE }}


  destroy:
    needs: determine-action
    if: ${{ needs.determine-action.outputs.destroy == 'true' }}
    runs-on: ${{ vars.RUNNER_SERVER }}
    timeout-minutes: 30
    environment: development
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install -y age

      - name: Create age key file
        run: |
          printf '%s\n' "${{ secrets.AGE_SECRET_KEY }}" > "${{ env.AGE_KEY_FILE }}"
          chmod 600 "${{ env.AGE_KEY_FILE }}"

      - name: Decrypt secrets key
        run: |
          age --decrypt --identity "${{ env.AGE_KEY_FILE }}" --output "${{ env.DECRYPTED_ENV_FILE }}" "${{ env.ENCRYPTED_ENV_FILE }}"
          chmod 600 "${{ env.DECRYPTED_ENV_FILE }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROOT_ACCOUNT_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "${{ env.TERRAFORM_VERSION }}"

      - name: Terraform destroy DEV
        env:
          TF_CLI_ARGS_destroy: "-auto-approve -input=false"
        run: make destroy WORKSPACE=${{ vars.WORKSPACE }}
